<div class="page-header">
  <h1>Produtos</h1>
  <button mat-fab extended color="primary" (click)="openFormDialog()">
    <mat-icon>add</mat-icon>
    Novo Produto
  </button>
</div>

<div class="filter-section">
  <mat-form-field appearance="outline">
    <mat-label>Buscar produto</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Ex. PROD-001">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
</div>

<div class="table-container">
  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <table mat-table [dataSource]="dataSource" matSort [hidden]="isLoading || dataSource.data.length === 0">
    <!-- Codigo Column -->
    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Código </th>
      <td mat-cell *matCellDef="let element"> {{element.codigo}} </td>
    </ng-container>

    <!-- Descricao Column -->
    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Descrição </th>
      <td mat-cell *matCellDef="let element"> {{element.descricao}} </td>
    </ng-container>

    <!-- Saldo Column -->
    <ng-container matColumnDef="saldo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Saldo </th>
      <td mat-cell *matCellDef="let element">
        <mat-chip [ngClass]="element.saldo > 0 ? 'status-active' : 'status-inactive'">
          {{element.saldo}}
        </mat-chip>
      </td>
    </ng-container>

    <!-- Acoes Column -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef> Ações </th>
      <td mat-cell *matCellDef="let element">
        <div class="action-buttons">
          <button mat-icon-button color="primary" matTooltip="Editar" (click)="openFormDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Excluir" (click)="deleteProduto(element)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div class="empty-state" *ngIf="!isLoading && dataSource.data.length === 0">
    <mat-icon>inventory_2</mat-icon>
    <p>Nenhum produto encontrado.</p>
  </div>

  <mat-paginator
    [length]="totalRecords"
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons>
  </mat-paginator>
</div>
