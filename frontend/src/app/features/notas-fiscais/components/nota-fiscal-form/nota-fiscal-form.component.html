<h2 mat-dialog-title>Nova Nota Fiscal</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form-container">
    <div class="loading-container" *ngIf="isLoadingProdutos">
      <mat-spinner diameter="32"></mat-spinner>
    </div>

    <div class="error-state" *ngIf="!isLoadingProdutos && hasErrorProdutos">
      <mat-icon>error_outline</mat-icon>
      <p>{{ errorMessageProdutos }}</p>
      <button mat-stroked-button type="button" color="primary" (click)="loadProdutos()">
        <mat-icon>refresh</mat-icon>
        Tentar novamente
      </button>
    </div>

    <div class="empty-state" *ngIf="!isLoadingProdutos && !hasErrorProdutos && produtos.length === 0">
      Nenhum produto cadastrado. Cadastre um produto na tela de Produtos antes de criar uma nota fiscal.
    </div>

    <div *ngIf="!isLoadingProdutos && !hasErrorProdutos && produtos.length > 0" formArrayName="itens" class="itens-container">
      <div *ngFor="let itemGroup of itens.controls; let i = index" [formGroupName]="i" class="item-row">
        <mat-form-field appearance="outline" class="produto-field">
          <mat-label>Produto</mat-label>
          <mat-select formControlName="produto_id">
            <mat-option *ngFor="let produto of produtos" [value]="produto.id">
              {{ produto.codigo }} — {{ produto.descricao }} (saldo: {{ produto.saldo }})
            </mat-option>
          </mat-select>
          <mat-error *ngIf="itemGroup.get('produto_id')?.hasError('required')">Selecione um produto</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="quantidade-field">
          <mat-label>Quantidade</mat-label>
          <input matInput type="number" formControlName="quantidade">
          <mat-error *ngIf="itemGroup.get('quantidade')?.hasError('required')">Obrigatório</mat-error>
          <mat-error *ngIf="itemGroup.get('quantidade')?.hasError('min')">Mínimo 1</mat-error>
        </mat-form-field>

        <button mat-icon-button color="warn" type="button" (click)="removeItem(i)" [disabled]="itens.length === 1">
          <mat-icon>delete</mat-icon>
        </button>
      </div>

      <button mat-stroked-button type="button" color="primary" (click)="addItem()">
        <mat-icon>add</mat-icon>
        Adicionar produto
      </button>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button mat-button (click)="onCancel()" [disabled]="isSubmitting">Cancelar</button>
  <button mat-flat-button color="primary" class="submit-button" (click)="onSubmit()" [disabled]="isSubmitting || form.invalid || isLoadingProdutos">
    <span *ngIf="!isSubmitting">Salvar</span>
    <mat-spinner *ngIf="isSubmitting" diameter="24" color="accent"></mat-spinner>
  </button>
</mat-dialog-actions>
