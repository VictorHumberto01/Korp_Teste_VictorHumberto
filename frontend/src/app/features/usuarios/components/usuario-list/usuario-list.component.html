<div class="page-header">
  <h1>Usuários</h1>
  <button mat-fab extended color="primary" (click)="openFormDialog()">
    <mat-icon>add</mat-icon>
    Novo Usuário
  </button>
</div>

<div class="filter-section">
  <mat-form-field appearance="outline">
    <mat-label>Buscar usuário</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Ex. João">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>
</div>

<div class="table-container">
  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <table mat-table [dataSource]="dataSource" matSort [hidden]="isLoading || dataSource.data.length === 0">
    <!-- Nome Column -->
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
      <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
      <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <!-- CPF Column -->
    <ng-container matColumnDef="cpf">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> CPF </th>
      <td mat-cell *matCellDef="let element"> {{formatCpf(element.cpf)}} </td>
    </ng-container>

    <!-- Ativo Column -->
    <ng-container matColumnDef="ativo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
      <td mat-cell *matCellDef="let element">
        <mat-chip [ngClass]="element.ativo ? 'status-active' : 'status-inactive'">
          {{element.ativo ? 'Ativo' : 'Inativo'}}
        </mat-chip>
      </td>
    </ng-container>

    <!-- Acoes Column -->
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef> Ações </th>
      <td mat-cell *matCellDef="let element">
        <div class="action-buttons">
          <button mat-icon-button color="primary" matTooltip="Editar" (click)="openFormDialog(element)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Excluir" [disabled]="!element.ativo" (click)="deleteUsuario(element)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div class="empty-state" *ngIf="!isLoading && dataSource.data.length === 0">
    <mat-icon>person_off</mat-icon>
    <p>Nenhum usuário encontrado.</p>
  </div>

  <mat-paginator 
    [length]="totalRecords"
    [pageSizeOptions]="[5, 10, 25]" 
    showFirstLastButtons>
  </mat-paginator>
</div>
